<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ground Level Languages</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Zero-Text Botanical Navigation (Abstract SVG Icons Only) -->
    <nav class="botanical-nav" aria-label="Mode Switcher">
      <button class="nav-orb active" data-view="story-view" aria-label="Story Carousel">
        <!-- Leaf / Sprout Icon (Story Mode) -->
        <svg viewBox="0 0 24 24" class="icon">
          <path d="M12 21V11M12 11C12 6.5 16 3 21 3C21 8 17.5 11 12 11ZM12 14C12 10 8.5 7 4 7C4 11.5 7 14 12 14Z" />
        </svg>
      </button>

      <button class="nav-orb" data-view="review-view" aria-label="Side-by-Side Review">
        <!-- Dual Seed / Wave Icon (Diagnostic Review Mode) -->
        <svg viewBox="0 0 24 24" class="icon">
          <circle cx="8" cy="12" r="4" />
          <circle cx="16" cy="12" r="4" />
          <path d="M12 4V20" stroke-dasharray="2 3" />
        </svg>
      </button>
    </nav>

    <!-- =========================================================
         SECTION 1: STORY PREVIEW CAROUSEL (Progressive Reveal)
         ========================================================= -->
    <main id="story-view" class="view-section active">
      <div class="carousel-stage">
        <button class="carousel-arrow prev" id="prev-card" aria-label="Previous">
          <svg viewBox="0 0 24 24" class="icon"><path d="M15 18L9 12L15 6" /></svg>
        </button>

        <div class="carousel-track" id="carousel-track">
          <!-- Card 1: Animal POV - Bird / Forest -->
          <article class="story-card active" data-index="0">
            <div class="card-visual">
              <!-- Abstract Bird & Sun Silhouette -->
              <svg viewBox="0 0 120 120" class="scene-art">
                <circle cx="82" cy="36" r="14" class="art-sun" />
                <path d="M25 75 Q45 45 70 60 Q85 45 95 55 Q80 75 55 82 Z" class="art-creature" />
                <path d="M15 95 Q60 85 105 95" class="art-ground" />
              </svg>
              <!-- Audio Pulse Ring -->
              <button class="play-seed-btn" aria-label="Play Preview">
                <span class="pulse-ring"></span>
                <svg viewBox="0 0 24 24" class="icon-fill"><polygon points="8,5 19,12 8,19" /></svg>
              </button>
            </div>
            <!-- Progressive Arc Indicator (Preview -> Primer -> Story) -->
            <div class="arc-dots">
              <span class="dot filled"></span>
              <span class="dot"></span>
              <span class="dot"></span>
            </div>
            <div class="veil-overlay"></div>
          </article>

          <!-- Card 2: Animal POV - Fox / Night -->
          <article class="story-card veiled" data-index="1">
            <div class="card-visual">
              <svg viewBox="0 0 120 120" class="scene-art">
                <path d="M35 35 A16 16 0 1 0 52 52 A12 12 0 1 1 35 35 Z" class="art-sun" />
                <polygon points="40,85 52,50 62,68 74,50 85,85" class="art-creature" />
                <path d="M15 95 Q60 90 105 95" class="art-ground" />
              </svg>
              <button class="play-seed-btn" aria-label="Play Preview">
                <span class="pulse-ring"></span>
                <svg viewBox="0 0 24 24" class="icon-fill"><polygon points="8,5 19,12 8,19" /></svg>
              </button>
            </div>
            <div class="arc-dots">
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
            </div>
            <div class="veil-overlay"></div>
          </article>

          <!-- Card 3: Animal POV - Fish / River -->
          <article class="story-card veiled" data-index="2">
            <div class="card-visual">
              <svg viewBox="0 0 120 120" class="scene-art">
                <path d="M20 40 Q40 32 60 40 T100 40" class="art-ground" />
                <path d="M35 68 Q60 48 82 68 Q60 88 35 68 Z M82 68 L98 56 L98 80 Z" class="art-creature" />
                <path d="M20 92 Q40 84 60 92 T100 92" class="art-ground" />
              </svg>
              <button class="play-seed-btn" aria-label="Play Preview">
                <span class="pulse-ring"></span>
                <svg viewBox="0 0 24 24" class="icon-fill"><polygon points="8,5 19,12 8,19" /></svg>
              </button>
            </div>
            <div class="arc-dots">
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
            </div>
            <div class="veil-overlay"></div>
          </article>
        </div>

        <button class="carousel-arrow next" id="next-card" aria-label="Next">
          <svg viewBox="0 0 24 24" class="icon"><path d="M9 18L15 12L9 6" /></svg>
        </button>
      </div>
    </main>

    <!-- =========================================================
         SECTION 2: SIDE-BY-SIDE REVIEW LAYOUT (Sub-Word Localization)
         ========================================================= -->
    <section id="review-view" class="view-section">
      <!-- Visual Anchor (Sensory Reality Image / Animation) -->
      <div class="sensory-anchor">
        <svg viewBox="0 0 100 100" class="anchor-icon">
          <!-- Abstract Cat Silhouette (No Text) -->
          <path d="M30 75 L34 40 L45 52 L55 52 L66 40 L70 75 Z" />
          <circle cx="44" cy="60" r="2.5" class="eye" />
          <circle cx="56" cy="60" r="2.5" class="eye" />
        </svg>
      </div>

      <!-- Side-by-Side Comparison Grid -->
      <div class="comparison-grid">
        <!-- LEFT PANEL: Learner's Attempt (e.g., "cot" divergence) -->
        <div class="compare-panel learner-panel">
          <div class="panel-emblem">
            <!-- Sprout / User Emblem -->
            <svg viewBox="0 0 24 24" class="icon">
              <circle cx="12" cy="8" r="4" />
              <path d="M5 20C5 16 8 14 12 14C16 14 19 16 19 20" />
            </svg>
          </div>

          <!-- Sub-Word Phoneme Timeline Shapes -->
          <div class="phoneme-timeline">
            <!-- Phoneme 1: Initial Consonant (Matched) -->
            <button class="phoneme-shape matched" data-phoneme="1" aria-label="Phoneme 1">
              <span class="shape-bar" style="height: 36px;"></span>
            </button>
            <!-- Phoneme 2: Vowel / Tone Contour (DIVERGED - Pulsing Botanical Highlight) -->
            <button class="phoneme-shape diverged" data-phoneme="2" aria-label="Diverged Phoneme">
              <span class="shape-orb"></span>
            </button>
            <!-- Phoneme 3: Final Consonant (Matched) -->
            <button class="phoneme-shape matched" data-phoneme="3" aria-label="Phoneme 3">
              <span class="shape-bar" style="height: 42px;"></span>
            </button>
          </div>

          <button class="audio-trigger learner-play" aria-label="Play Attempt">
            <svg viewBox="0 0 24 24" class="icon-fill"><polygon points="8,5 19,12 8,19" /></svg>
          </button>
        </div>

        <!-- CENTER DIVIDER (Visual Mirror Line) -->
        <div class="mirror-divider">
          <span class="seed-node"></span>
        </div>

        <!-- RIGHT PANEL: Target Native Audio (e.g., "cat" reference) -->
        <div class="compare-panel target-panel">
          <div class="panel-emblem">
            <!-- Mature Tree / Native Emblem -->
            <svg viewBox="0 0 24 24" class="icon">
              <path d="M12 3L5 14H10V21H14V14H19L12 3Z" />
            </svg>
          </div>

          <!-- Sub-Word Phoneme Timeline Shapes -->
          <div class="phoneme-timeline">
            <button class="phoneme-shape matched" data-phoneme="1" aria-label="Target Phoneme 1">
              <span class="shape-bar" style="height: 36px;"></span>
            </button>
            <!-- Target Phoneme 2 (Highlighted Contrast) -->
            <button class="phoneme-shape target-focus" data-phoneme="2" aria-label="Target Phoneme 2">
              <span class="shape-wave"></span>
            </button>
            <button class="phoneme-shape matched" data-phoneme="3" aria-label="Target Phoneme 3">
              <span class="shape-bar" style="height: 42px;"></span>
            </button>
          </div>

          <button class="audio-trigger target-play" aria-label="Play Target">
            <svg viewBox="0 0 24 24" class="icon-fill"><polygon points="8,5 19,12 8,19" /></svg>
          </button>
        </div>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
