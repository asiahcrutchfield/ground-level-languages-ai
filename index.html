<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ground Level Languages</title>
    <meta name="description" content="A zero-text vocabulary prototype for Ground Level Languages, using pictures, phonemes, syllables, and tones.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- =============================================
         🧭 FLOATING STAGE NAV (Zero-Text Botanical Dots)
         ============================================= -->
    <nav class="stage-nav" aria-label="Stages">
        <button class="stage-nav-dot active" data-target="vocab-stage" aria-label="Vocabulary Stage"></button>
        <button class="stage-nav-dot" data-target="listening-test" aria-label="Listening Test"></button>
        <button class="stage-nav-dot" data-target="pronunciation-test" aria-label="Pronunciation Test"></button>
        <button class="stage-nav-dot" data-target="diagnostic-stage" aria-label="Diagnostic Test"></button>
        <button class="stage-nav-dot" data-target="test-review-wrapper" aria-label="Review Stage"></button>
    </nav>

    <!-- =============================================
         🌿 VOCAB STAGE
         ============================================= -->
    <div id="vocab-stage">

        <!-- =========================================
             🖼️ PICTURE CAROUSEL
             ========================================= -->
        <ul id="picture-carousel" class="vocab-item-wrapper" aria-label="Vocabulary picture carousel">

            <!-- Previous card -->
            <li class="carousel-card prev" data-index="4" role="button" tabindex="0" aria-label="Previous word">
                <div class="picture-frame">
                    <img class="carousel-pic" alt="" />
                </div>
            </li>

            <!-- Active (center) card -->
            <li class="carousel-card active" data-index="0" role="button" tabindex="0" aria-label="Current word">
                <div class="picture-frame">
                    <img class="carousel-pic" alt="" />
                </div>
                <button class="carousel-play-btn" aria-label="Play word audio">
                    <!-- Play triangle rendered purely via CSS/SVG — zero text -->
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <polygon points="6,3 20,12 6,21" fill="#F7F4EB"/>
                    </svg>
                </button>
            </li>

            <!-- Next card -->
            <li class="carousel-card next" data-index="1" role="button" tabindex="0" aria-label="Next word">
                <div class="picture-frame">
                    <img class="carousel-pic" alt="" />
                </div>
            </li>

        </ul><!-- /#picture-carousel -->


        <!-- =========================================
             🔡 WORD BREAKDOWN CONTAINER
             ========================================= -->
        <div id="breakdown-wrapper">

            <!-- ── Category switcher circles ── -->
            <div id="category-wrapper" role="tablist" aria-label="Breakdown category">

                <!-- Phonemes button -->
                <div class="breakdown-frame breakdown-category active"
                     id="phoneme-category"
                     role="tab"
                     tabindex="0"
                     aria-selected="true"
                     aria-controls="phoneme-panel"
                     data-category="phoneme"
                     title="Phonemes">
                    <img src="images/symbols/phonemes_transparent.png" alt="" class="category-img" aria-hidden="true">
                </div>

                <!-- Syllables button -->
                <div class="breakdown-frame breakdown-category"
                     id="syllable-category"
                     role="tab"
                     tabindex="0"
                     aria-selected="false"
                     aria-controls="syllable-panel"
                     data-category="syllable"
                     title="Syllables">
                    <img src="images/symbols/syllables_transparent.png" alt="" class="category-img" aria-hidden="true">
                </div>

                <!-- Tone button -->
                <div class="breakdown-frame breakdown-category"
                     id="tone-category"
                     role="tab"
                     tabindex="0"
                     aria-selected="false"
                     aria-controls="tone-panel"
                     data-category="tone"
                     title="Tones">
                    <img src="images/symbols/tones_transparent.png" alt="" class="category-img" aria-hidden="true">
                </div>

            </div><!-- /#category-wrapper -->


            <!-- ── Stage: horizontal timeline with shapes ── -->
            <div id="stage-wrapper">
                <div class="stage-items-wrapper">

                    <!-- PHONEME PANEL -->
                    <ul class="category-list all-phonemes-list active"
                        id="phoneme-panel"
                        role="tabpanel"
                        aria-labelledby="phoneme-category">
                        <!-- Items injected by script.js -->
                    </ul>

                    <!-- SYLLABLE PANEL -->
                    <ul class="category-list syllable-list"
                        id="syllable-panel"
                        role="tabpanel"
                        aria-labelledby="syllable-category">
                        <!-- Items injected by script.js -->
                    </ul>

                    <!-- TONE PANEL -->
                    <ul class="category-list tone-list"
                        id="tone-panel"
                        role="tabpanel"
                        aria-labelledby="tone-category">
                        <!-- Items injected by script.js -->
                    </ul>

                </div><!-- /.stage-items-wrapper -->

                <!-- The horizon line -->
                <div id="breakdown-stage"></div>

            </div><!-- /#stage-wrapper -->

        </div><!-- /#breakdown-wrapper -->

    </div><!-- /#vocab-stage -->

    <!-- =============================================
         📝 ASSESSMENT STAGE
         ============================================= -->
    <div id="assessment-stage">
        <!-- 👂 listening test 👂 -->
        <div class="assessment-wrapper" id="listening-test">
            <div class="listening-choice choice-1 symbol-frame" role="button" aria-label="First sound choice" tabindex="0">
                <svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,8 94,88 6,88" fill="#C86D51"/></svg>
            </div>

            <div class="listening-question symbol-frame" role="button" aria-label="Play sound" tabindex="0">
                <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M14 50h10l8-18 12 36 12-42 12 48 10-24 8 0" fill="none" stroke="#2D6A4F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>

            <div class="listening-choice choice-2 symbol-frame" role="button" aria-label="Second sound choice" tabindex="0">
                <svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,5 61,36 94,36 67,55 77,88 50,68 23,88 33,55 6,36 39,36" fill="#2A85A8"/></svg>
            </div>
        </div><!-- /#👂 listening test 👂 -->

        <!-- 🗣️ pronunciation test 🗣️ -->
        <div class="assessment-wrapper" id="pronunciation-test">
            <div class="pronunciation-stage-inner">
                <!-- Top-Right Target Row -->
                <div class="pronunciation-task-wrapper" id="pronunciation-target-wrapper">
                    <div class="pronunciation-task question" id="pronunciation-target" role="button" tabindex="0" aria-label="Play target native sound">
                        <!-- Target soundwave on the left -->
                        <div class="pronunciation-soundwave soundwave" id="pronunciation-target-soundwave"></div>
                        <!-- Circular native trigger on the right -->
                        <div class="pronunciation-symbol-frame symbol-frame" id="pronunciation-symbol-frame">
                            <svg viewBox="0 0 100 100" class="native-target-svg" aria-hidden="true">
                                <circle cx="50" cy="50" r="42" fill="#EFECE2" stroke="#2D6A4F" stroke-width="3.5"/>
                                <circle cx="50" cy="50" r="14" fill="#2D6A4F"/>
                                <path d="M 28,50 A 22,22 0 0,1 72,50" fill="none" stroke="#2D6A4F" stroke-width="3" stroke-linecap="round"/>
                                <path d="M 28,50 A 22,22 0 0,0 72,50" fill="none" stroke="#2D6A4F" stroke-width="3" stroke-linecap="round"/>
                                <path d="M 20,50 A 30,30 0 0,1 80,50" fill="none" stroke="#2D6A4F" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4" opacity="0.75"/>
                                <path d="M 20,50 A 30,30 0 0,0 80,50" fill="none" stroke="#2D6A4F" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4" opacity="0.75"/>
                            </svg>
                        </div>
                    </div>
                </div>

                <!-- Bottom-Left Practice Row -->
                <div class="pronunciation-task-wrapper" id="pronunciation-practice-wrapper">
                    <div class="pronunciation-task practice" id="pronunciation-practice" role="button" tabindex="0" aria-label="Play recorded practice sound">
                        <!-- Circular speaking-profile badge on the left -->
                        <div class="pronunciation-symbol-frame symbol-frame" id="pronunciation-practice-symbol-frame">
                            <img src="images/symbols/speaking_transparent.png" alt="" class="symbol-img" aria-hidden="true">
                        </div>
                        <!-- Practice soundwave on the right -->
                        <div class="pronunciation-soundwave soundwave" id="pronunciation-practice-soundwave"></div>
                    </div>
                </div>

                <!-- 🔴 Record Track (--- ● ---) 🔴 -->
                <div class="record-btn-wrapper" id="pronunciation-btn-wrapper">
                    <button class="record-btn" id="pronunciation-record-btn" aria-label="Record pronunciation">
                        <!-- Tactile terracotta circle with botanical pulse — zero text -->
                    </button>
                </div>
            </div>
        </div><!-- /#🗣️ pronunciation test 🗣️ -->

        <!-- 🔄 test review 🔄 -->
        <div class="review-wrapper" id="test-review-wrapper">
            <!-- user review column (left) -->
            <div class="review-column" id="user-review-column">
                <ul class="review-list" id="user-review-list">
                    <!-- optional items injected by script.js -->
                </ul>
                <div class="test-review-item" id="user-review-item">
                    <!-- Centered user recorded soundwave at top -->
                    <div class="review-soundwave soundwave" id="user-review-soundwave" role="button" tabindex="0" aria-label="Replay recorded pronunciation"></div>
                    <!-- Replay symbol in lower-left corner -->
                    <div class="review-icon-container" id="user-review-icon-container" role="button" tabindex="0" aria-label="Replay recorded pronunciation">
                        <svg viewBox="0 0 40 40" class="replay-svg" aria-hidden="true">
                            <circle cx="20" cy="20" r="18" fill="rgba(255,255,255,0.85)"/>
                            <path d="M 14,20 A 7,7 0 1,1 21,27" fill="none" stroke="#C86D51" stroke-width="2.6" stroke-linecap="round"/>
                            <polygon points="10,16 16,19 12,23" fill="#C86D51"/>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- results column (center) -->
            <div class="review-column" id="results-review-column">
                <div class="results-divider-line"></div>
                <div class="results-badge" id="results-badge" aria-label="Pronunciation comparison result">
                    <svg viewBox="0 0 60 60" class="results-match-svg" aria-hidden="true">
                        <circle cx="30" cy="30" r="24" fill="#52B788"/>
                        <polyline points="19,31 27,39 42,22" fill="none" stroke="#F7F4EB" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <ul class="review-list" id="results-review-list">
                    <!-- items injected by script.js -->
                </ul>
            </div>

            <!-- target review column (right) -->
            <div class="review-column" id="target-review-column">
                <ul class="review-list" id="target-review-list">
                    <!-- optional items injected by script.js -->
                </ul>
                <div class="test-review-item" id="target-review-item">
                    <!-- Centered target soundwave at top -->
                    <div class="review-soundwave soundwave" id="target-review-soundwave" role="button" tabindex="0" aria-label="Replay native target pronunciation"></div>
                    <!-- Replay symbol in lower-right corner -->
                    <div class="review-icon-container" id="target-review-icon-container" role="button" tabindex="0" aria-label="Replay native target pronunciation">
                        <svg viewBox="0 0 40 40" class="replay-svg" aria-hidden="true">
                            <circle cx="20" cy="20" r="18" fill="rgba(255,255,255,0.85)"/>
                            <path d="M 14,20 A 7,7 0 1,1 21,27" fill="none" stroke="#2D6A4F" stroke-width="2.6" stroke-linecap="round"/>
                            <polygon points="10,16 16,19 12,23" fill="#2D6A4F"/>
                        </svg>
                    </div>
                </div>
            </div>
        </div><!-- /#🔄 test review 🔄 -->

        <!-- 🗣️🩺👂 pronunciation & speaking diagnostic 🗣️🩺👂 -->
        <div class="pron-speaking-diagnostic-wrapper" id="diagnostic-stage">
            <!-- Progress bar for hearing diagnostic -->
            <div class="progress-container diagnostic-progress-container" id="hearing-progress-container">
                <div class="progress-bar diagnostic-progress-bar" id="hearing-progress-bar">
                    <div class="progress-symbol diagnostic-progress-symbol symbol-frame" id="hearing-progress-symbol-frame">
                        <span class="progress-dot progress-indicator" aria-hidden="true"></span>
                    </div>
                    <div class="progress-fill diagnostic-progress-fill hearing-side-fill" id="hearing-progress-fill"></div>
                </div>
            </div>

            <!-- Diagnostic standard -->
            <div class="standard-wrapper" id="diagnostic-standard-wrapper">
                <div class="diagnostic-standard mountain-meter">
                    <svg viewBox="0 0 240 220" aria-hidden="true"><path d="M120 8 232 212H8Z" fill="#EFECE2" stroke="#D3CEB6" stroke-width="5" stroke-linejoin="round"/></svg>
                </div>
            </div>

            <!-- Progress bar for pronunciation diagnostic -->
            <div class="progress-container diagnostic-progress-container" id="pronunciation-progress-container">
                <div class="progress-bar diagnostic-progress-bar" id="pronunciation-progress-bar">
                    <div class="progress-symbol diagnostic-progress-symbol symbol-frame" id="pronunciation-progress-symbol-frame">
                        <span class="progress-dot progress-indicator" aria-hidden="true"></span>
                    </div>
                    <div class="progress-fill diagnostic-progress-fill pronunciation-side-fill" id="pronunciation-progress-fill"></div>
                </div>
            </div>
        </div><!-- /#🗣️🩺👂 pronunciation & speaking diagnostic 🗣️🩺👂 -->

    </div><!-- /#assessment-stage -->

    <script src="script.js" defer></script>
</body>
</html>
