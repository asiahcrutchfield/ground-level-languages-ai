<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ground Level Languages</title>
    <meta name="description" content="A zero-text vocabulary prototype for Ground Level Languages, using pictures, phonemes, syllables, and tones.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- =============================================
         🧭 MAIN MENU
         ============================================= -->
    <!-- Later, a main menu can be added to organize everything. -->

    <!-- =============================================
         🌿 VOCAB STAGE
         ============================================= -->
    <div id="vocab-stage">

        <!-- =========================================
             🖼️ PICTURE CAROUSEL
             ========================================= -->
        <ul id="picture-carousel" class="vocab-item-wrapper" aria-label="Vocabulary picture carousel">

            <!-- Previous card -->
            <li class="carousel-card prev" data-index="4" role="button" tabindex="0" aria-label="Previous word">
                <div class="picture-frame">
                    <img class="carousel-pic" alt="" />
                </div>
            </li>

            <!-- Active (center) card -->
            <li class="carousel-card active" data-index="0" role="button" tabindex="0" aria-label="Current word">
                <div class="picture-frame">
                    <img class="carousel-pic" alt="" />
                </div>
                <button class="carousel-play-btn" aria-label="Play word audio">
                    <!-- Play triangle rendered purely via CSS/SVG — zero text -->
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <polygon points="6,3 20,12 6,21" fill="#F7F4EB"/>
                    </svg>
                </button>
            </li>

            <!-- Next card -->
            <li class="carousel-card next" data-index="1" role="button" tabindex="0" aria-label="Next word">
                <div class="picture-frame">
                    <img class="carousel-pic" alt="" />
                </div>
            </li>

        </ul><!-- /#picture-carousel -->


        <!-- =========================================
             🔡 WORD BREAKDOWN CONTAINER
             ========================================= -->
        <div id="breakdown-wrapper">

            <!-- ── Category switcher circles ── -->
            <div id="category-wrapper" role="tablist" aria-label="Breakdown category">

                <!-- Phonemes button -->
                <div class="breakdown-frame breakdown-category active"
                     id="phoneme-category"
                     role="tab"
                     tabindex="0"
                     aria-selected="true"
                     aria-controls="phoneme-panel"
                     data-category="phoneme"
                     title="Phonemes">
                    <img src="images/symbols/phonemes_transparent.png" alt="" class="category-img" aria-hidden="true">
                </div>

                <!-- Syllables button -->
                <div class="breakdown-frame breakdown-category"
                     id="syllable-category"
                     role="tab"
                     tabindex="0"
                     aria-selected="false"
                     aria-controls="syllable-panel"
                     data-category="syllable"
                     title="Syllables">
                    <img src="images/symbols/syllables_transparent.png" alt="" class="category-img" aria-hidden="true">
                </div>

                <!-- Tone button -->
                <div class="breakdown-frame breakdown-category"
                     id="tone-category"
                     role="tab"
                     tabindex="0"
                     aria-selected="false"
                     aria-controls="tone-panel"
                     data-category="tone"
                     title="Tones">
                    <img src="images/symbols/tones_transparent.png" alt="" class="category-img" aria-hidden="true">
                </div>

            </div><!-- /#category-wrapper -->


            <!-- ── Stage: horizontal timeline with shapes ── -->
            <div id="stage-wrapper">
                <div class="stage-items-wrapper">

                    <!-- PHONEME PANEL -->
                    <ul class="category-list all-phonemes-list active"
                        id="phoneme-panel"
                        role="tabpanel"
                        aria-labelledby="phoneme-category">
                        <!-- Items injected by script.js -->
                    </ul>

                    <!-- SYLLABLE PANEL -->
                    <ul class="category-list syllable-list"
                        id="syllable-panel"
                        role="tabpanel"
                        aria-labelledby="syllable-category">
                        <!-- Items injected by script.js -->
                    </ul>

                    <!-- TONE PANEL -->
                    <ul class="category-list tone-list"
                        id="tone-panel"
                        role="tabpanel"
                        aria-labelledby="tone-category">
                        <!-- Items injected by script.js -->
                    </ul>

                </div><!-- /.stage-items-wrapper -->

                <!-- The horizon line -->
                <div id="breakdown-stage"></div>

            </div><!-- /#stage-wrapper -->

        </div><!-- /#breakdown-wrapper -->

    </div><!-- /#vocab-stage -->

    <!-- =============================================
         📝 ASSESSMENT STAGE
         ============================================= -->
    <div id="assessment-stage" hidden>
        <!-- 👂 listening test 👂 -->
        <div class="assessment-wrapper" id="listening-test" aria-label="Listening test" hidden>
            <img id="listening-picture" alt="">
            <div class="listening-controls">
                <button type="button" class="listening-choice choice-1" data-side="left" aria-label="Choose triangle" disabled></button>
                <button type="button" class="listening-question" id="listening-play" aria-label="Play both sounds">
                    <svg viewBox="0 0 100 60" aria-hidden="true"><path id="assessment-waveform" d="M3 32H16L20 26L24 37L29 21L34 42L39 8L44 52L49 23L54 39L59 15L64 45L69 22L74 37L79 27L84 32H97" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <button type="button" class="listening-choice choice-2" data-side="right" aria-label="Choose star" disabled></button>
            </div>
            <button type="button" class="listening-next" id="listening-next" aria-label="Next trial" disabled>→</button>
        </div><!-- /#👂 listening test 👂 -->

        <!-- 🗣️ pronunciation test 🗣️ -->
        <div class="assessment-wrapper" id="pronunciation-test" aria-label="Pronunciation practice" hidden>
            <button type="button" id="pronunciation-back" aria-label="Return to vocabulary">←</button>
            <div class="pronunciation-reference">
                <img id="pronunciation-picture" alt="">
                <button type="button" class="pronunciation-action" id="pronunciation-native-play" aria-label="Play reference audio">
                    <span aria-hidden="true">▶</span>
                    <svg viewBox="0 0 100 60" aria-hidden="true"><use href="#assessment-waveform"/></svg>
                </button>
            </div>
            <div class="pronunciation-practice">
                <button type="button" class="pronunciation-action" id="pronunciation-record-btn" aria-label="Start recording" disabled>●</button>
                <meter id="pronunciation-mic-level" min="0" max="1" value="0" aria-label="Microphone input level" hidden></meter>
                <div class="pronunciation-replay" id="pronunciation-replay" hidden>
                    <button type="button" class="pronunciation-action" id="pronunciation-user-play" aria-label="Play your recording" disabled>
                        <span aria-hidden="true">▶</span>
                        <svg viewBox="0 0 100 60" aria-hidden="true"><use href="#assessment-waveform"/></svg>
                    </button>
                    <button type="button" class="pronunciation-action" id="pronunciation-retry" aria-label="Record again" disabled>↻</button>
                </div>
            </div>
            <output id="pronunciation-status" aria-live="polite" hidden></output>
        </div><!-- /#🗣️ pronunciation test 🗣️ -->

        <!-- 🗣️🩺👂 pronunciation & speaking diagnostic 🗣️🩺👂 -->
        <div class="pron-speaking-diagnostic-wrapper">
            <!-- Progress bar for hearing diagnostic -->
            <div class="progress-container diagnostic-progress-container" id="hearing-progress-container">
                <div class="progress-bar diagnostic-progress-bar" id="hearing-progress-bar">
                    <div class="progress-symbol diagnostic-progress-symbol symbol-frame" id="hearing-progress-symbol-frame">
                        <!-- insert symbol here -->
                    </div>
                    <div class="progress-fill diagnostic-progress-fill" id="hearing-progress-fill"></div>
                </div>
            </div>

            <!-- Diagnostic standard -->
            <div class="standard-wrapper" id="diagnostic-standard-wrapper">
                <div class="diagnostic-standard">
                    <!-- insert standard here (e.g., a visual representation of a mountain
                     to represent the standard)-->
                </div>
            </div>

            <!-- Progress bar for pronunciation diagnostic -->
            <div class="progress-container diagnostic-progress-container" id="pronunciation-progress-container">
                <div class="progress-bar diagnostic-progress-bar" id="pronunciation-progress-bar">
                    <div class="progress-symbol diagnostic-progress-symbol symbol-frame" id="pronunciation-progress-symbol-frame">
                        <!-- insert symbol here -->
                    </div>
                    <div class="progress-fill diagnostic-progress-fill" id="pronunciation-progress-fill"></div>
                </div>
            </div>
        </div><!-- /#🗣️🩺👂 pronunciation & speaking diagnostic 🗣️🩺👂 -->

        <!-- 🔄 test review 🔄 -->
        <div class="review-wrapper" id="test-review-wrapper" aria-label="Listening review" hidden>
            <output id="listening-score"></output>
            <!-- user review column -->
            <div class="review-column" id="user-review-column">
                <ul class="review-list" id="user-review-list">
                    <!-- items injected by script.js -->
                </ul>
                <div class="test-review-item" id="user-review-item">
                    <div class="review-soundwave soundwave" id="user-review-soundwave">
                        <!-- soundwave can be generated by script.js -->
                        <!-- soundwave should preferably be centered -->
                    </div>
                    <div class="review-icon-container" id="user-review-icon-container">
                        <!-- insert icon here. should allow playback -->
                        <!-- preferably on the lower left hand side -->
                    </div>
                </div>
            </div>

            <!-- results column -->
            <div class="review-column" id="results-review-column">
                <ul class="review-list" id="results-review-list">
                    <!-- items injected by script.js -->
                    <!-- for now, symbols can be ✔️ and ❌ -->
                </ul>
            </div>

            <!-- target review column -->
            <div class="review-column" id="target-review-column">
                <ul class="review-list" id="target-review-list">
                    <!-- items injected by script.js -->
                </ul>
                <div class="test-review-item" id="target-review-item">
                    <div class="review-soundwave soundwave" id="target-review-soundwave">
                        <!-- soundwave can be generated by script.js -->
                        <!-- soundwave should preferably be centered -->
                    </div>
                    <div class="review-icon-container" id="target-review-icon-container">
                        <!-- insert icon here. should allow playback -->
                        <!-- preferably on the lower right hand side -->
                    </div>
                </div>
            </div>
            <div class="listening-review-actions" id="listening-review-actions"></div>
        </div><!-- /#🔄 test review 🔄 -->

    </div><!-- /#assessment-stage -->

    <script src="script.js" defer></script>
</body>
</html>
